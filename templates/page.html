<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{doc_title}}</title>
    <meta name="description" content="{{description}}" />
    {{robots}}
    <link rel="canonical" href="{{canonical}}" />
    <meta name="theme-color" content="#325EA6" />
    <meta property="og:site_name" content="{{site}}" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:type" content="{{og_type}}" />
    <meta property="og:title" content="{{doc_title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{base}}/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:image:alt" content="{{og_alt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cuesoftinc" />
    <meta name="twitter:creator" content="@cuesoftinc" />
    <meta name="twitter:title" content="{{doc_title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{base}}/assets/og-card.png" />
    <meta name="twitter:image:alt" content="{{og_alt}}" />
    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="628" />
    <script type="application/ld+json">
      {{jsonld}}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link
      rel="preload"
      href="/assets/design-system/fonts/Fustat-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/design-system.css" />
    <!-- prettier-ignore -->
    <script data-cuesoft-theme-prepaint="cuesoft-theme">(function(){try{var d=document.documentElement,t=null;try{t=localStorage.getItem("cuesoft-theme")}catch(e){}var c=t==='dark'||t==='light';var m=window.matchMedia('(prefers-color-scheme: dark)');var k=c?t==='dark':m.matches;if(k)d.classList.add("dark");if(c)d.setAttribute('data-theme',t);else if(m.addEventListener)m.addEventListener('change',function(e){if(!d.hasAttribute('data-theme'))d.classList.toggle("dark",e.matches)});window.__cueThemePrepaint=1}catch(e){}})()</script>
  </head>
  <body>
    {{skip}} {{header}} {{main}}
    <footer>{{legal}}</footer>
    {{theme_toggle}} {{rum}}
  </body>
</html>
