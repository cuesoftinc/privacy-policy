<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{doc_title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta name="theme-color" content="#325EA6" />
    <meta property="og:site_name" content="{{site}}" />
    <meta property="og:type" content="{{og_type}}" />
    <meta property="og:title" content="{{doc_title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{base}}/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{site}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{doc_title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{base}}/assets/og-card.png" />
    <script type="application/ld+json">
      {{jsonld}}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/design-system/fonts/Fustat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/assets/design-system.css" />
    <style>
      .table-wrap {
        overflow-x: auto;
      }
    </style>
    <script data-cuesoft-theme-prepaint="cuesoft-theme">(function(){try{var d=document.documentElement,t=null;try{t=localStorage.getItem("cuesoft-theme")}catch(e){}var c=t==='dark'||t==='light';var m=window.matchMedia('(prefers-color-scheme: dark)');var k=c?t==='dark':m.matches;if(k)d.classList.add("dark");if(c)d.setAttribute('data-theme',t);else if(m.addEventListener)m.addEventListener('change',function(e){if(!d.hasAttribute('data-theme'))d.classList.toggle("dark",e.matches)})}catch(e){}})()</script>
  </head>
  <body>
    {{skip}}
    {{header}}
    <main id="main" tabindex="-1">{{shell}}</main>
    <footer>{{legal}}</footer>
    <script>
      (function () {
        var button = document.querySelector('.ds-theme-toggle');
        if (!button) return;
        var root = document.documentElement;
        function show() {
          var dark = root.classList.contains('dark');
          button.setAttribute('aria-pressed', String(dark));
          button.querySelector('[data-theme-mark="moon"]').hidden = dark;
          button.querySelector('[data-theme-mark="sun"]').hidden = !dark;
        }
        button.addEventListener('click', function () {
          var next = root.classList.contains('dark') ? 'light' : 'dark';
          root.classList.toggle('dark', next === 'dark');
          root.setAttribute('data-theme', next);
          try {
            localStorage.setItem('cuesoft-theme', next);
          } catch (e) {}
          show();
        });
        show();
      })();
    </script>
  </body>
</html>
